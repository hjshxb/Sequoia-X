[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sequoia-x"
version = "2.0.0"
requires-python = ">=3.10"
dependencies = [
    "akshare>=1.10",
    "baostock>=0.9",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "pandas>=2.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "pytest-mock>=3.12",
]

# 只在 sequoia_x 包内做自动发现，避免把 data/ logs/ reports/ 等
# 数据目录误当作顶层包（新版 setuptools 的 flat-layout 检查会直接报错）。
[tool.setuptools.packages.find]
include = ["sequoia_x*"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
